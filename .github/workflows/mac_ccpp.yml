name: MacOS C++ CI

on: 
    workflow_dispatch:
      inputs:
        debug_enabled:
          type: boolean
          description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
          required: false
          default: false
    push:
    pull_request:
    repository_dispatch:
        types: [mac-compile-test, install-test]
jobs:
  macos_arm:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      with:
        detached: true
    - name: submodule checkout
      run: git submodule update --init --recursive
    - name: Setup dependencies
      uses: ./.github/actions/setup-cpp
    - name: make
      run: make -j
    - name: download db
      run: ./amrfinder -u
    - name: Software and DB versions
      run: |
          cat version.txt
          ./amrfinder --database_version
    - name: make test
      run: make test
    - name: test for no-overwrite database update (PD-3469 / https://github.com/ncbi/amr/issues/16)
      run: ./amrfinder -u 2>&1 | fgrep 'Skipping update'
    - name: make github_binaries
      run: |
          make github_binaries
          version=`cat version.txt`
          mv amrfinder_binaries_v$version.tar.gz amrfinder_binaries_macos_aarch64_v$version.tar.gz
    - uses: actions/upload-artifact@v4
      with:
          name: release-binary-macos-arm64.tar.gz
          path: amrfinder_binaries_macos_aarch64_v*.tar.gz
  macos_x86_64:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      with:
        detached: true
    - name: submodule checkout
      run: git submodule update --init --recursive
    - name: Setup dependencies
      uses: ./.github/actions/setup-cpp
    - name: make
      run: make -j
    - name: download db
      run: ./amrfinder -u
    - name: Software and DB versions
      run: |
          cat version.txt
          ./amrfinder --database_version
    - name: make test
      run: make test
    - name: test for no-overwrite database update (PD-3469 / https://github.com/ncbi/amr/issues/16)
      run: ./amrfinder -u 2>&1 | fgrep 'Skipping update'
    - name: make github_binaries
      run: |
          make github_binaries
          version=`cat version.txt`
          mv amrfinder_binaries_v$version.tar.gz amrfinder_binaries_macos_x86_64_v$version.tar.gz
    - uses: actions/upload-artifact@v4
      with:
          name: release-binary-macos-x86_64.tar.gz
          path: amrfinder_binaries_macos_x86_64_v*.tar.gz
