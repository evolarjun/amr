name: Linux bioconda 

on:
    workflow_dispatch:
      inputs:
        debug_enabled:
          type: boolean
          description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
          required: false
          default: false
    schedule:
        - cron: '15 3 * * *' # 3:15am everyday
    repository_dispatch:
        types: [linux-bioconda-test, install-test]
jobs:
  conda_linux_x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      with:
        detached: true
    - name: When was this run
      run: date
    - uses: actions/checkout@v4
    - name: Setup Conda and AMRFinderPlus
      uses: ./.github/actions/setup-conda
    - name: download latest AMRFinderPlus database
      shell: bash -el {0}
      run: |
          echo CONDA_PREFIX = ${CONDA_PREFIX}
          amrfinder --force_update
    - name: Software and DB version
      shell: bash -el {0}
      run: |
          amrfinder --database_version
    - name: download tests
      run: |
          BASE_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master
          curl --silent -L -O ${BASE_URL}/test_amrfinder.sh
    - name: run tests
      shell: bash -el {0}
      run: |
          echo CONDA_PREFIX = $CONDA_PREFIX
          bash ./test_amrfinder.sh -p
  conda_linux_aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      with:
        detached: true
    - uses: actions/checkout@v4
    - name: Setup Conda and AMRFinderPlus
      uses: ./.github/actions/setup-conda
    - name: download latest AMRFinderPlus database
      shell: bash -el {0}
      run: amrfinder --force_update
    - name: Software and DB version
      shell: bash -el {0}
      run: amrfinder --database_version
    - name: download tests
      run: |
          BASE_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master
          curl --silent -L -O ${BASE_URL}/test_amrfinder.sh
    - name: run tests
      shell: bash -el {0}
      run: bash ./test_amrfinder.sh -p
